name: Build Raha Fast Reset Unified APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Validate source
        run: python3 tools/verify_source.py
      - name: Build single debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify and rename APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/Raha-Fast-Reset-v1.0.1-debug.apk
          sha256sum release/*.apk
      - name: Upload single APK
        uses: actions/upload-artifact@v4
        with:
          name: Raha-Fast-Reset-v1.0.1-Debug
          path: release/Raha-Fast-Reset-v1.0.1-debug.apk
          if-no-files-found: error
